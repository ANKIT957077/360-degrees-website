<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° Insights — 360 Degrees Consulting</title>
  <meta name="description" content="Research reports, strategy memos and perspectives from 360 Degrees Consulting." />
  <meta name="author" content="360 Degrees Consulting" />

  <!-- Preconnect to Google Fonts for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Open Graph Tags (for social sharing & LinkedIn) -->
  <meta property="og:title" content="360° Insights — 360 Degrees Consulting" />
  <meta property="og:description" content="Research reports, strategy memos and perspectives from 360 Degrees Consulting." />
  <meta property="og:type" content="website" />
  <!-- Replace DOMAIN PLACEHOLDER with real domain before launch -->
  <meta property="og:url" content="https://[DOMAIN PLACEHOLDER]/insights.html" />
  <!-- Replace OG IMAGE PLACEHOLDER with a 1200x630px branded image before launch -->
  <meta property="og:image" content="https://[DOMAIN PLACEHOLDER]/assets/og-image.jpg" />

  <!-- Twitter/X Card Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="360° Insights — 360 Degrees Consulting" />
  <meta name="twitter:description" content="Research reports, strategy memos and perspectives from 360 Degrees Consulting." />

  <!-- Canonical Tag (Replace DOMAIN PLACEHOLDER with real domain before launch) -->
  <link rel="canonical" href="https://[DOMAIN PLACEHOLDER]/insights.html" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-root="">

  <!-- Shared Global Navbar (Injected synchronously by js/site.js from js/config.js) -->
  <header class="editorial-header" id="site-header"></header>

  <main>
    <!-- =========================================================================
         PAGE INTRO SECTION
         - H1: "360° Insights"
         - Subtitle: "How we think. What we're researching. What it means for your business."
         ========================================================================= -->
    <!-- Navy Page Header Band -->
    <div class="page-header">
      <div class="container">
        <div class="page-header-eyebrow">360° INSIGHTS</div>
        <h1 class="page-header-title">How we think.</h1>
      </div>
    </div>

    <section class="insights-intro-section">
      <div class="container insights-intro-container">
        <p class="insights-subtitle">What we're researching. What it means for your business.</p>

        <!-- =====================================================================
             SIMPLE FREE-TEXT SEARCH
             - Filters cards in real time across title, summary, and tags.
             ===================================================================== -->
        <div class="insights-search-wrap">
          <input 
            type="search" 
            id="insights-search" 
            class="insights-search-input" 
            placeholder="Search reports, memos, tags, or topics..." 
            aria-label="Search insights"
          />
        </div>

        <!-- =====================================================================
             FILTERS ROW
             - Content Type: All · Reports · Memos · Case Studies · Perspectives
             - Category Pills: Rendered dynamically from window.INSIGHTS_CATEGORIES
             ===================================================================== -->
        <div class="insights-filter-container">
          <!-- Content Type Filter Buttons -->
          <div class="insights-type-filters" id="insights-type-filters" role="tablist" aria-label="Content Type Filters">
            <button type="button" class="insight-type-btn active" data-type="all">All</button>
            <button type="button" class="insight-type-btn" data-type="report">Reports</button>
            <button type="button" class="insight-type-btn" data-type="memo">Memos</button>
            <button type="button" class="insight-type-btn" data-type="case-study">Case Studies</button>
            <button type="button" class="insight-type-btn" data-type="perspective">Perspectives</button>
          </div>

          <!-- Category Pills (Injected dynamically by vanilla JS from window.INSIGHTS_CATEGORIES) -->
          <div class="insights-category-pills" id="insights-category-pills" role="toolbar" aria-label="Category Filters"></div>
        </div>
      </div>
    </section>

    <!-- =========================================================================
         INSIGHTS CONTENT AREA
         - 1. Featured Report: Full-width hero card
         - 2. Latest Insights: 3-column responsive card grid
         ========================================================================= -->
    <div class="container">
      
      <!-- 1. FEATURED REPORT (Rendered dynamically from window.INSIGHTS_DATA) -->
      <section class="featured-report-wrap" id="featured-report-container"></section>

      <!-- 2. LATEST INSIGHTS GRID -->
      <section class="latest-insights-section">
        <div class="latest-insights-header">
          <h2 class="latest-insights-title">Latest</h2>
        </div>
        <div class="insights-grid-3" id="latest-insights-grid"></div>
      </section>

    </div>

    <!-- =========================================================================
         BOTTOM NAVY CTA BAND
         ========================================================================= -->
    <section class="team-cta-band">
      <div class="container">
        <div class="team-cta-wrap">
          <h2 class="team-cta-title">Commission a Custom Research Memo</h2>
          <p class="team-cta-sub">
            Have a specific market, competitor, or commercial question? Our collegiate pods can conduct targeted primary research for your mandate.
          </p>
          <a href="contact.html" class="btn-ed btn-ed-warm">Bring Us Your Problem &rarr;</a>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared Navy Footer (Injected synchronously by js/site.js from js/config.js) -->
  <footer class="editorial-footer" id="site-footer"></footer>

  <!-- =========================================================================
       NOTE ON INDIVIDUAL ARTICLE PAGES:
       For v1, the hub index links to insights/[id].html but these individual
       pages do not need to be auto-generated from the data file yet.
       When the client sends real articles, Antigravity will create each article
       as a real HTML file using the correct template (report or memo) as a base.
       ========================================================================= -->

  <!-- Global Shared Config & Site Layout Engine -->
  <script src="js/config.js"></script>
  <script src="js/site.js"></script>

  <!-- Insights CMS Data File -->
  <script src="data/insights.js"></script>

  <!-- Vanilla JavaScript Dynamic Insights Renderer, Search & Filter Controller -->
  <script>
    (function () {
      'use strict';

      const articles = window.INSIGHTS_DATA || [];
      const categories = window.INSIGHTS_CATEGORIES || [];

      // State tracking
      let selectedType = 'all';
      let selectedCategory = 'all';
      let searchQuery = '';

      const searchInput = document.getElementById('insights-search');
      const typeFilterContainer = document.getElementById('insights-type-filters');
      const catFilterContainer = document.getElementById('insights-category-pills');
      const featuredContainer = document.getElementById('featured-report-container');
      const latestContainer = document.getElementById('latest-insights-grid');

      // 1. Render Category Pills dynamically from window.INSIGHTS_CATEGORIES
      function renderCategoryPills() {
        if (!catFilterContainer) return;
        let pillsHtml = '<button type="button" class="insight-cat-pill active" data-category="all">All Categories</button>';
        categories.forEach(function (cat) {
          pillsHtml += '<button type="button" class="insight-cat-pill" data-category="' + cat + '">' + cat + '</button>';
        });
        catFilterContainer.innerHTML = pillsHtml;

        // Attach click listeners
        const pills = catFilterContainer.querySelectorAll('.insight-cat-pill');
        pills.forEach(function (pill) {
          pill.addEventListener('click', function () {
            pills.forEach(function (p) { p.classList.remove('active'); });
            pill.classList.add('active');
            selectedCategory = pill.getAttribute('data-category');
            applyFiltersAndRender();
          });
        });
      }

      // 2. Filter articles based on type, category, and free-text search
      function getFilteredArticles() {
        return articles.filter(function (article) {
          // Type filter
          if (selectedType !== 'all') {
            if (selectedType === 'report' && article.type !== 'report') return false;
            if (selectedType === 'memo' && article.type !== 'memo') return false;
            if (selectedType === 'case-study' && article.type !== 'case-study') return false;
            if (selectedType === 'perspective' && article.type !== 'perspective') return false;
          }

          // Category filter
          if (selectedCategory !== 'all') {
            if (article.category !== selectedCategory) return false;
          }

          // Search query filter
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase().trim();
            const inTitle = (article.title || '').toLowerCase().indexOf(q) !== -1;
            const inSummary = (article.summary || '').toLowerCase().indexOf(q) !== -1;
            const inSubtitle = (article.subtitle || '').toLowerCase().indexOf(q) !== -1;
            const inAuthor = (article.author || '').toLowerCase().indexOf(q) !== -1;
            const inTags = (article.tags || []).some(function (t) {
              return t.toLowerCase().indexOf(q) !== -1;
            });
            if (!inTitle && !inSummary && !inSubtitle && !inAuthor && !inTags) {
              return false;
            }
          }

          return true;
        });
      }

      // 3. Render DOM from filtered results
      function applyFiltersAndRender() {
        const filtered = getFilteredArticles();
        const featured = filtered.find(function (a) { return a.featured; });
        const nonFeatured = filtered.filter(function (a) { return !a.featured; });

        // Render Featured Card
        if (featuredContainer) {
          if (featured) {
            featuredContainer.style.display = 'block';
            featuredContainer.innerHTML = 
              '<div class="featured-report-card">' +
                '<div class="featured-kicker-row">' +
                  '<span class="featured-badge">Featured ' + (featured.type === 'report' ? 'Research Report' : 'Memo') + '</span>' +
                  '<span class="featured-category">' + featured.category + '</span>' +
                '</div>' +
                '<h2 class="featured-report-title">' + featured.title + '</h2>' +
                '<div class="featured-report-sub">' + featured.subtitle + '</div>' +
                '<div class="featured-report-meta">' +
                  '<span>By <strong>' + featured.author + '</strong></span>' +
                  '<span>&bull;</span>' +
                  '<span>' + featured.date + '</span>' +
                  '<span>&bull;</span>' +
                  '<span>' + featured.readingTime + '</span>' +
                '</div>' +
                '<p class="featured-report-summary">' + featured.summary + '</p>' +
                '<a href="insights/' + featured.id + '.html" class="btn-ed btn-ed-primary">Read the ' + (featured.type === 'report' ? 'Report' : 'Memo') + ' &rarr;</a>' +
              '</div>';
          } else {
            featuredContainer.style.display = 'none';
            featuredContainer.innerHTML = '';
          }
        }

        // Render Latest Grid
        if (latestContainer) {
          const cardsToRender = nonFeatured;

          if (cardsToRender.length === 0 && !featured) {
            latestContainer.innerHTML = 
              '<div class="insights-empty-state">' +
                '<h3 class="insights-empty-title">No insights found</h3>' +
                '<p class="insights-empty-desc">Try modifying your search keywords or resetting the category filter.</p>' +
              '</div>';
          } else if (cardsToRender.length === 0 && featured) {
            latestContainer.innerHTML = 
              '<div class="insights-empty-state">' +
                '<h3 class="insights-empty-title">All results featured above</h3>' +
                '<p class="insights-empty-desc">Select "All Categories" or adjust filters to view more publications.</p>' +
              '</div>';
          } else {
            latestContainer.innerHTML = cardsToRender.map(function (article) {
              return '<article class="insight-grid-card">' +
                '<div class="insight-grid-card-tag">' + article.category + '</div>' +
                '<h3 class="insight-grid-card-title">' + article.title + '</h3>' +
                '<div class="insight-grid-card-meta">' +
                  '<span>' + article.author + '</span>' +
                  '<span>&bull;</span>' +
                  '<span>' + article.date + '</span>' +
                  '<span>&bull;</span>' +
                  '<span>' + article.readingTime + '</span>' +
                '</div>' +
                '<p class="insight-grid-card-summary">' + (article.subtitle || article.summary) + '</p>' +
                '<a href="insights/' + article.id + '.html" class="insight-grid-card-link">Read &rarr;</a>' +
              '</article>';
            }).join('');
          }
        }
      }

      // Setup Type filter buttons
      if (typeFilterContainer) {
        const typeButtons = typeFilterContainer.querySelectorAll('.insight-type-btn');
        typeButtons.forEach(function (btn) {
          btn.addEventListener('click', function () {
            typeButtons.forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            selectedType = btn.getAttribute('data-type');
            applyFiltersAndRender();
          });
        });
      }

      // Setup Search input
      if (searchInput) {
        searchInput.addEventListener('input', function (e) {
          searchQuery = e.target.value;
          applyFiltersAndRender();
        });
      }

      // Initialize
      renderCategoryPills();
      applyFiltersAndRender();
    })();
  </script>

</body>
</html>
